name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin version matches tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          # Every plugin version field and pinned npm package must collapse to the one tag version.
          got="$(jq -rs '[.[0].version, .[1].plugins[0].version, .[2].version, .[2].optionalDependencies[]] | unique | join(" ")' \
            packaging/claude-plugin/.claude-plugin/plugin.json .claude-plugin/marketplace.json packaging/claude-plugin/package.json)"
          test "$got" = "$want" || { echo "plugin.json, marketplace.json, and package.json versions ($got) must all equal tag version $want"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/agent-coordinator_${GOOS}_${GOARCH}${ext}" ./cmd/agent-coordinator
          done
      - name: Build MCP bundles (.mcpb)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            ext=""
            plat="$GOOS"
            if [ "$GOOS" = "windows" ]; then ext=".exe"; plat="win32"; fi
            stage="$(mktemp -d)"
            mkdir -p "$stage/server"
            install -m 0755 "dist/agent-coordinator_${GOOS}_${GOARCH}${ext}" \
              "$stage/server/agent-coordinator${ext}"
            jq --arg v "$VERSION" --arg p "$plat" \
              '.version = $v | .compatibility.platforms = [$p]' \
              packaging/mcpb/manifest.json > "$stage/manifest.json"
            out="$PWD/dist/agent-coordinator_${GOOS}_${GOARCH}.mcpb"
            # Prefer the official packer; a .mcpb is a zip archive, so fall back to zip.
            npx --yes @anthropic-ai/mcpb pack "$stage" "$out" || {
              rm -f "$out"
              (cd "$stage" && zip -qr9 "$out" .)
            }
            rm -rf "$stage"
          done
      - name: Calculate artifact checksums
        run: |
          cd dist
          sha256sum agent-coordinator_* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      - name: Publish npm platform packages
        if: vars.NPM_PUBLISH == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Without a token, npm authenticates through OIDC trusted publishing.
          if [ -n "$NPM_TOKEN" ]; then npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"; fi
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            ext=""
            os="$GOOS"
            cpu="$GOARCH"
            if [ "$GOOS" = "windows" ]; then ext=".exe"; os="win32"; fi
            if [ "$GOARCH" = "amd64" ]; then cpu="x64"; fi
            name="agent-coordinator-cli-${os}-${cpu}"
            # Skip versions already on the registry so a re-run only publishes what is missing.
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${name}@${VERSION} is already published"
              continue
            fi
            stage="$(mktemp -d)"
            jq --arg n "$name" --arg v "$VERSION" --arg os "$os" --arg cpu "$cpu" --arg f "agent-coordinator${ext}" \
              '.name = $n | .version = $v | .os = [$os] | .cpu = [$cpu] | .files = [$f]' \
              packaging/npm/package.json > "$stage/package.json"
            cp packaging/npm/README.md LICENSE "$stage/"
            install -m 0755 "dist/agent-coordinator_${GOOS}_${GOARCH}${ext}" "$stage/agent-coordinator${ext}"
            npm publish "$stage" --access public --provenance
            rm -rf "$stage"
          done
